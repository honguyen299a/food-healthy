<div class="dp-shell">
  <button
    #trigger
    type="button"
    cdkOverlayOrigin
    #origin="cdkOverlayOrigin"
    class="dp-trigger"
    (click)="toggle()"
    [attr.aria-expanded]="open"
    aria-haspopup="dialog"
    [attr.aria-label]="'Chọn ngày, ' + formattedDate"
  >
    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.7"
      aria-hidden="true"
    >
      <rect x="3" y="5" width="18" height="16" rx="3" />
      <path d="M7 3v4m10-4v4M3 10h18m-11 4h3m3 0h2m-8 3h3" />
    </svg>
    <span>{{ formattedDate }}</span>
    <svg
      class="dp-chevron"
      [class.open]="open"
      viewBox="0 0 20 20"
      fill="none"
      stroke="currentColor"
      stroke-width="1.6"
      aria-hidden="true"
    >
      <path d="m5 8 5 5 5-5" />
    </svg>
  </button>
</div>
<ng-template
  cdkConnectedOverlay
  [cdkConnectedOverlayOrigin]="origin"
  [cdkConnectedOverlayOpen]="open"
  [cdkConnectedOverlayPositions]="positions"
  [cdkConnectedOverlayViewportMargin]="16"
  [cdkConnectedOverlayPush]="true"
  (attach)="focusCalendar()"
  (overlayOutsideClick)="close(false)"
  (overlayKeydown)="onKeydown($event)"
  (detach)="open = false"
>
  <section
    class="dp-popup app-date-popup"
    role="dialog"
    aria-label="Lịch chọn ngày"
    cdkTrapFocus
    [cdkTrapFocusAutoCapture]="true"
  >
    <div class="dp-top">
      <span>CHỌN NGÀY</span
      ><button type="button" class="dp-close" aria-label="Đóng lịch" (click)="close()">×</button>
    </div>
    <mat-calendar
      [selected]="selectedDate"
      [startAt]="selectedDate"
      [minDate]="minDate"
      [maxDate]="maxDate"
      (selectedChange)="pickDate($event)"
    />
    <div class="dp-footer">
      <span>{{ formattedDate }}</span
      ><button type="button" (click)="selectToday()">Hôm nay</button>
    </div>
  </section>
</ng-template>
